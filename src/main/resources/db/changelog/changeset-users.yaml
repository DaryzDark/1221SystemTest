databaseChangeLog:
  - changeSet:
      id: 1
      author: admin
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: age
                  type: INT
              - column:
                  name: weight
                  type: DECIMAL(5,2)
              - column:
                  name: height
                  type: INT
              - column:
                  name: goal
                  type: VARCHAR(50)
              - column:
                  name: daily_calorie_target
                  type: DECIMAL(6,2)